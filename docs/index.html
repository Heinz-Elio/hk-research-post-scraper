<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Research Posts</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #e2e5ea;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --tag-bg: #eef2ff;
      --tag-text: #3730a3;
      --chip-on: #1d4ed8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; }

    .meta { color: var(--muted); font-size: 0.875rem; }

    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: wait; }

    .update-form {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .honey {
      position: absolute;
      left: -9999px;
      height: 0;
      width: 0;
      opacity: 0;
    }

    .filters {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      display: grid;
      gap: 0.75rem;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    label, #domains-label { font-size: 0.8rem; color: var(--muted); margin-right: 0.25rem; }

    select, input[type="search"] {
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
      background: white;
    }

    input[type="search"] { min-width: 220px; flex: 1; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.on {
      background: var(--tag-bg);
      border-color: var(--primary);
      color: var(--chip-on);
    }
    .chip.tag-btn { font: inherit; }

    .results-info {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--primary); text-decoration: underline; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 500;
      border: none;
      cursor: default;
    }
    .badge-stale {
      background: #fef3c7;
      color: #92400e;
      margin-left: 0.35rem;
    }
    .badge-new {
      background: #dcfce7;
      color: #166534;
    }
    .card-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }
    .card-actions button {
      font: inherit;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      cursor: pointer;
    }
    .card-actions button.on {
      background: var(--chip-on);
      color: #fff;
      border-color: var(--chip-on);
    }
    .search-status {
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.1rem;
      margin-top: 0.3rem;
    }
    .date-note {
      display: block;
      margin-top: 0.15rem;
    }
    button.tag {
      cursor: pointer;
    }
    button.tag:hover { background: #dbe4ff; }

    .summary, .summary-list {
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .summary { white-space: pre-wrap; }
    .summary-list {
      margin: 0 0 0.5rem 1.1rem;
      display: grid;
      gap: 0.25rem;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .filter-row {
        flex-direction: column;
        align-items: stretch;
      }
      input[type="search"] { min-width: 0; }
    }

    #results { scroll-margin-top: 12px; }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .pagination button {
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      color: var(--text);
      cursor: pointer;
      font-size: 0.875rem;
    }

    .pagination button:hover:not(:disabled) { background: var(--tag-bg); }
    .pagination button:disabled { opacity: 0.45; cursor: not-allowed; }

    #page-info { color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>HK Research Posts</h1>
      <div class="meta" id="last-updated">Loading...</div>
    </div>
    <form id="request-update" class="update-form">
      <input class="honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" type="submit">Request Update</button>
      <span class="meta" id="update-status" role="status"></span>
    </form>
  </header>

  <section class="filters">
    <div class="filter-row">
      <div>
        <label for="filter-source">Source</label>
        <select id="filter-source">
          <option value="">All</option>
        </select>
      </div>
      <div>
        <label for="filter-work">Work type</label>
        <select id="filter-work">
          <option value="">All</option>
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
          <option value="Full-time/Part-time">Full-time/Part-time</option>
          <option value="unspecified">Unspecified</option>
        </select>
      </div>
      <div>
        <label for="filter-held">I hold</label>
        <select id="filter-held">
          <option value="">Any</option>
          <option value="1">Bachelor</option>
          <option value="2">Master</option>
          <option value="3">Doctor</option>
        </select>
      </div>
      <div>
        <label for="filter-requires">Post requires</label>
        <select id="filter-requires">
          <option value="">All</option>
          <option value="bachelor">Bachelor</option>
          <option value="master">Master</option>
          <option value="doctor">Doctor</option>
          <option value="unspecified">Unspecified</option>
        </select>
      </div>
      <div>
        <label for="filter-contract">Contract</label>
        <select id="filter-contract">
          <option value="">Any</option>
          <option value="le6">6 months or less</option>
          <option value="6-12">6–12 months</option>
          <option value="12-24">12–24 months</option>
          <option value="gt24">More than 24 months</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>
      <div>
        <label for="filter-place">Place</label>
        <select id="filter-place">
          <option value="">Any</option>
          <option value="Hong Kong">Hong Kong</option>
          <option value="Guangzhou">Guangzhou</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>
      <div>
        <label for="filter-deadline">Deadline</label>
        <select id="filter-deadline">
          <option value="">Any</option>
          <option value="has">Has a closing date</option>
          <option value="soon">Closing within 30 days</option>
          <option value="none">No hard deadline</option>
        </select>
      </div>
      <div>
        <label for="sort-by">Sort by</label>
        <select id="sort-by">
          <option value="close_date">Upcoming first</option>
          <option value="scraped_at">Newest scraped</option>
          <option value="title">Title</option>
          <option value="relevance">Relevance</option>
        </select>
      </div>
    </div>
    <div class="filter-row">
      <div>
        <label for="search">Search</label>
        <input type="search" id="search" placeholder="Search by meaning, title, domain, or summary..." />
        <div class="search-status" id="search-status" aria-live="polite"></div>
      </div>
      <div>
        <label for="filter-shortlist">
          <input type="checkbox" id="filter-shortlist" />
          Shortlisted only
        </label>
      </div>
      <div>
        <label for="filter-hide-applied">
          <input type="checkbox" id="filter-hide-applied" />
          Hide applied
        </label>
      </div>
    </div>
    <div>
      <span id="domains-label">Domains</span>
      <div class="chip-row" id="domain-chips" role="group" aria-labelledby="domains-label"></div>
    </div>
  </section>

  <div class="results-info" id="results-info">Loading posts...</div>
  <div id="results"></div>

  <nav class="pagination" id="pagination" aria-label="Job listing pages">
    <button id="prev-page" type="button" disabled>Previous</button>
    <span id="page-info" aria-live="polite">Page 1 of 1</span>
    <button id="next-page" type="button" disabled>Next</button>
  </nav>

  <script type="module">
    const DATA_URL = "./research_posts.json";
    const EMBED_URL = "./embeddings.json";

    const DOMAIN_LABELS = {
      "ai-ml": "AI / ML",
      "computer-science": "Computer Science",
      "data": "Data",
      "electronics": "Electronics",
      "robotics": "Robotics",
      "mechanical": "Mechanical",
      "civil": "Civil",
      "biomedical": "Biomedical",
      "life-science": "Life Science",
      "chemistry": "Chemistry",
      "physics": "Physics",
      "materials": "Materials",
      "environment": "Environment",
      "math-stats": "Math / Stats",
      "industrial": "Industrial / Systems",
      "health": "Health",
    };

    const PAGE_SIZE = 20;
    let allPosts = [];
    let currentPage = 1;
    const selectedDomains = new Set();
    let embedItems = {};
    let queryVector = null;
    let lastQuery = "";
    let embedder = null;
    let semanticReady = false;
    let semanticStarted = false;
    let searchTimer = null;
    const STORE_SEEN = "hkrps-seen-scraped-at";
    const STORE_SHORT = "hkrps-shortlist";
    const STORE_APPLIED = "hkrps-applied";

    function readJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (err) {
        return fallback;
      }
    }

    let seenBefore = "";
    try { seenBefore = localStorage.getItem(STORE_SEEN) || ""; } catch (err) { seenBefore = ""; }
    const shortlist = new Set(Array.isArray(readJson(STORE_SHORT, [])) ? readJson(STORE_SHORT, []) : []);
    const applied = new Set(Array.isArray(readJson(STORE_APPLIED, [])) ? readJson(STORE_APPLIED, []) : []);

    function saveSets() {
      try {
        localStorage.setItem(STORE_SHORT, JSON.stringify([...shortlist]));
        localStorage.setItem(STORE_APPLIED, JSON.stringify([...applied]));
      } catch (err) { /* private mode */ }
    }

    function rememberVisit(posts) {
      let newest = "";
      posts.forEach((p) => {
        if (p.scraped_at && p.scraped_at > newest) newest = p.scraped_at;
      });
      if (!newest) return;
      try { localStorage.setItem(STORE_SEEN, newest); } catch (err) { /* private mode */ }
    }

    function degreeRank(post) {
      if (typeof post.degree_rank === "number") return post.degree_rank;
      const map = { unspecified: 0, bachelor: 1, master: 2, doctor: 3, Bachelor: 1, Master: 2, Doctor: 3, Any: 0 };
      return map[post.min_degree] ?? map[post.degree_level] ?? 0;
    }

    function domainLabel(id) {
      return DOMAIN_LABELS[id] || id;
    }

    function dequantize(item) {
      if (!item || !item.q) return null;
      const scale = item.scale || 0;
      return item.q.map((v) => v * scale);
    }

    function cosine(a, b) {
      if (!a || !b || a.length !== b.length) return 0;
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        na += a[i] * a[i];
        nb += b[i] * b[i];
      }
      return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-9);
    }

    function keywordScore(post, q) {
      if (!q) return 0;
      const domains = (post.domains || []).map(domainLabel).join(" ");
      const hay = `${post.title || ""} ${post.summary || ""} ${post.department || ""} ${domains}`.toLowerCase();
      if (hay.includes(q)) return 1;
      const parts = q.split(/\s+/).filter(Boolean);
      if (!parts.length) return 0;
      const hits = parts.filter((w) => hay.includes(w)).length;
      return hits / parts.length;
    }

    /* BROWSE_PURE_START */
    function todayISO(now) {
      const d = now || new Date();
      const z = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
    }

    function isUpcoming(post, today) {
      const close = post.close_date || "";
      if (!close || close < today) return false;
      const kind = post.date_type || "";
      if (kind === "deadline" || kind === "review_start") return true;
      if (!kind) return true;
      return false;
    }

    function sortPosts(list, sortBy, today) {
      const copy = list.slice();
      const day = today || todayISO();
      copy.sort((a, b) => {
        if (sortBy === "title") return (a.title || "").localeCompare(b.title || "");
        if (sortBy === "scraped_at") return (b.scraped_at || "").localeCompare(a.scraped_at || "");
        const pa = isUpcoming(a, day);
        const pb = isUpcoming(b, day);
        if (pa !== pb) return pa ? -1 : 1;
        if (pa) return (a.close_date || "").localeCompare(b.close_date || "");
        return (b.scraped_at || "").localeCompare(a.scraped_at || "");
      });
      return copy;
    }

    function workMatches(post, work) {
      const value = post.work_type || "";
      if (!work) return true;
      if (work === "unspecified") return !value;
      if (work === "Full-time") return value === "Full-time" || value === "Full-time/Part-time";
      return value === work;
    }

    function encodeBrowseState(state) {
      const params = new URLSearchParams();
      const put = (key, value) => { if (value) params.set(key, value); };
      put("src", state.src);
      put("work", state.work);
      put("held", state.held);
      put("req", state.req);
      put("contract", state.contract);
      put("place", state.place);
      put("deadline", state.deadline);
      if (state.sort && state.sort !== "close_date") params.set("sort", state.sort);
      put("q", state.q);
      if (state.page && Number(state.page) > 1) params.set("page", String(state.page));
      if (state.domains && state.domains.length) params.set("domains", state.domains.join(","));
      if (state.short) params.set("short", "1");
      if (state.hideApplied) params.set("hideApplied", "1");
      const qs = params.toString();
      return qs ? `?${qs}` : "";
    }

    function decodeBrowseState(search) {
      const raw = String(search || "");
      const params = new URLSearchParams(raw.startsWith("?") ? raw.slice(1) : raw);
      const page = Number(params.get("page") || "1");
      return {
        src: params.get("src") || "",
        work: params.get("work") || "",
        held: params.get("held") || "",
        req: params.get("req") || "",
        contract: params.get("contract") || "",
        place: params.get("place") || "",
        deadline: params.get("deadline") || "",
        sort: params.get("sort") || "close_date",
        sortSet: params.has("sort"),
        q: params.get("q") || "",
        page: Number.isFinite(page) && page > 0 ? page : 1,
        domains: (params.get("domains") || "").split(",").filter(Boolean),
        short: params.get("short") === "1",
        hideApplied: params.get("hideApplied") === "1",
      };
    }
    /* BROWSE_PURE_END */

    function currentBrowseState() {
      return {
        src: document.getElementById("filter-source").value,
        work: document.getElementById("filter-work").value,
        held: document.getElementById("filter-held").value,
        req: document.getElementById("filter-requires").value,
        contract: document.getElementById("filter-contract").value,
        place: document.getElementById("filter-place").value,
        deadline: document.getElementById("filter-deadline").value,
        sort: document.getElementById("sort-by").value,
        q: document.getElementById("search").value.trim(),
        page: currentPage,
        domains: [...selectedDomains].sort(),
        short: document.getElementById("filter-shortlist").checked,
        hideApplied: document.getElementById("filter-hide-applied").checked,
      };
    }

    function writeBrowseUrl() {
      const next = `${location.pathname}${encodeBrowseState(currentBrowseState())}`;
      if (`${location.pathname}${location.search}` !== next) {
        history.replaceState(null, "", next);
      }
    }

    function setSelect(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      const ok = [...el.options].some((opt) => opt.value === value);
      el.value = ok ? value : (el.options[0] ? el.options[0].value : "");
    }

    function applyBrowseState(state) {
      setSelect("filter-source", state.src);
      setSelect("filter-work", state.work);
      setSelect("filter-held", state.held);
      setSelect("filter-requires", state.req);
      setSelect("filter-contract", state.contract);
      setSelect("filter-place", state.place);
      setSelect("filter-deadline", state.deadline);
      setSelect("sort-by", state.sort || "close_date");
      document.getElementById("search").value = state.q || "";
      document.getElementById("filter-shortlist").checked = !!state.short;
      document.getElementById("filter-hide-applied").checked = !!state.hideApplied;
      selectedDomains.clear();
      (state.domains || []).forEach((id) => selectedDomains.add(id));
      document.querySelectorAll("#domain-chips .chip").forEach((btn) => {
        btn.classList.toggle("on", selectedDomains.has(btn.dataset.domain));
      });
      if (state.sortSet) document.getElementById("sort-by").dataset.user = "1";
      currentPage = state.page || 1;
    }

    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error("Failed to load data");
        allPosts = await res.json();
        if (!Array.isArray(allPosts)) allPosts = Object.values(allPosts);

        const sources = [...new Set(allPosts.map((p) => p.source).filter(Boolean))].sort();
        const sourceSelect = document.getElementById("filter-source");
        sources.forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          sourceSelect.appendChild(opt);
        });

        const domainIds = new Set();
        allPosts.forEach((p) => (p.domains || []).forEach((d) => domainIds.add(d)));
        const chipBox = document.getElementById("domain-chips");
        [...domainIds].sort().forEach((id) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip";
          btn.dataset.domain = id;
          btn.textContent = domainLabel(id);
          btn.addEventListener("click", () => {
            if (selectedDomains.has(id)) selectedDomains.delete(id);
            else selectedDomains.add(id);
            btn.classList.toggle("on", selectedDomains.has(id));
            resetPageAndRender();
          });
          chipBox.appendChild(btn);
        });
        if (!domainIds.size) {
          chipBox.textContent = "No domain tags yet — run the collector migrate.";
          chipBox.style.color = "var(--muted)";
          chipBox.style.fontSize = "0.8rem";
        }

        const latest = allPosts.reduce((max, p) => {
          return p.scraped_at && p.scraped_at > max ? p.scraped_at : max;
        }, "");
        document.getElementById("last-updated").textContent =
          latest ? `Last scraped: ${latest.replace("T", " ").slice(0, 16)}` : "No data yet";

        applyBrowseState(decodeBrowseState(location.search));
        render();
        rememberVisit(allPosts);
        if (document.getElementById("search").value.trim()) startSemantic();
      } catch (err) {
        document.getElementById("results-info").textContent =
          "Could not load posts. Make sure research_posts.json exists on the main branch.";
        console.error(err);
      }
    }

    function startSemantic() {
      if (semanticStarted) return;
      semanticStarted = true;
      document.getElementById("search-status").textContent = "Loading semantic search…";
      initSemantic();
    }

    async function initSemantic() {
      const status = document.getElementById("search-status");
      try {
        const res = await fetch(EMBED_URL);
        if (!res.ok) throw new Error("no embeddings");
        const data = await res.json();
        embedItems = data.items || data;
        if (!Object.keys(embedItems).length) throw new Error("empty embeddings");

        status.textContent = "Loading semantic model…";
        const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
        env.allowLocalModels = false;
        embedder = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2");
        semanticReady = true;
        status.textContent = "Semantic search ready";
        if (document.getElementById("search").value.trim()) {
          await updateQueryVector();
          render();
        }
      } catch (err) {
        semanticReady = false;
        status.textContent = "Keyword search only";
        console.info("Semantic search unavailable", err);
      }
    }

    async function updateQueryVector() {
      const q = document.getElementById("search").value.trim();
      lastQuery = q;
      if (!q || !semanticReady || !embedder) {
        queryVector = null;
        return;
      }
      const out = await embedder(q, { pooling: "mean", normalize: true });
      queryVector = Array.from(out.data);
    }

    function getFiltered() {
      const source = document.getElementById("filter-source").value;
      const work = document.getElementById("filter-work").value;
      const held = document.getElementById("filter-held").value;
      const requires = document.getElementById("filter-requires").value;
      const q = document.getElementById("search").value.trim().toLowerCase();
      const sortBy = document.getElementById("sort-by").value;
      const heldRank = held ? Number(held) : 0;
      const useSemantic = Boolean(q && semanticReady && queryVector);

      let list = allPosts.filter((p) => {
        if (source && p.source !== source) return false;
        if (!workMatches(p, work)) return false;
        if (document.getElementById("filter-shortlist").checked && !shortlist.has(p.id)) return false;
        if (document.getElementById("filter-hide-applied").checked && applied.has(p.id)) return false;
        if (heldRank) {
          const rank = degreeRank(p);
          if (rank > heldRank) return false;
        }
        if (requires) {
          const md = (p.min_degree || "").toLowerCase();
          if (requires === "unspecified") {
            if (md && md !== "unspecified") return false;
            if (!md && p.degree_level) return false;
          } else if (md !== requires) {
            return false;
          }
        }
        const contract = document.getElementById("filter-contract").value;
        if (contract && !contractMatches(p, contract)) return false;
        const place = document.getElementById("filter-place").value;
        if (place && postPlace(p) !== place) return false;
        const deadline = document.getElementById("filter-deadline").value;
        if (deadline && !deadlineMatches(p, deadline)) return false;
        if (selectedDomains.size) {
          const ds = new Set(p.domains || []);
          let hit = false;
          selectedDomains.forEach((d) => { if (ds.has(d)) hit = true; });
          if (!hit) return false;
        }
        if (q && !useSemantic && keywordScore(p, q) <= 0) return false;
        return true;
      });

      if (q && useSemantic && sortBy === "relevance") {
        list = list.map((p) => {
          const packed = embedItems[p.id];
          const vec = dequantize(packed);
          const sem = vec ? cosine(queryVector, vec) : 0;
          const kw = keywordScore(p, q);
          return { post: p, score: 0.75 * sem + 0.25 * kw };
        }).sort((a, b) => b.score - a.score).map((x) => x.post);
      } else if (q && sortBy === "relevance") {
        list = list.map((p) => ({ post: p, score: keywordScore(p, q) }))
          .sort((a, b) => b.score - a.score)
          .map((x) => x.post);
      } else {
        list = sortPosts(list, sortBy === "relevance" ? "close_date" : sortBy);
      }

      return list;
    }

    function render() {
      const list = getFiltered();
      const container = document.getElementById("results");
      const info = document.getElementById("results-info");
      const q = document.getElementById("search").value.trim();

      const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pagePosts = list.slice(start, start + PAGE_SIZE);

      const mode = q && semanticReady && queryVector ? "semantic + filters" : "filters";
      info.textContent = `${list.length} post${list.length !== 1 ? "s" : ""} (${mode})`;

      document.getElementById("page-info").textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById("prev-page").disabled = currentPage <= 1;
      document.getElementById("next-page").disabled = currentPage >= totalPages;
      writeBrowseUrl();

      if (pagePosts.length === 0) {
        container.innerHTML = `<div class="empty">No matching posts</div>`;
        return;
      }

      container.innerHTML = pagePosts.map((p) => {
        const fresh = seenBefore && p.scraped_at && p.scraped_at > seenBefore
          ? `<span class="tag badge-new">New</span>`
          : "";
        const metaTags = [p.id, p.source, p.work_type, degreeLabel(p), p.department]
          .filter(Boolean)
          .map((t) => `<span class="tag">${escapeHtml(t)}</span>`)
          .join("") + fresh;
        const shortOn = shortlist.has(p.id);
        const appliedOn = applied.has(p.id);
        const domainTags = (p.domains || [])
          .map((id) => `<button type="button" class="tag" data-domain="${escapeHtml(id)}">${escapeHtml(domainLabel(id))}</button>`)
          .join("");

        return `
          <article class="card">
            <div class="card-title">
              <a href="${escapeHtml(p.url || "#")}" target="_blank" rel="noopener">
                ${escapeHtml(p.title || "Untitled")}
              </a>
            </div>
            <div class="tags">${metaTags}${domainTags}</div>
            ${summaryHtml(p.summary)}
            <div class="card-footer">${dateFooter(p)}${contractFooter(p)}</div>
            <div class="card-actions">
              <button type="button" class="pin${shortOn ? " on" : ""}" data-act="short" data-id="${escapeHtml(p.id || "")}">${shortOn ? "Shortlisted" : "Shortlist"}</button>
              <button type="button" class="pin${appliedOn ? " on" : ""}" data-act="applied" data-id="${escapeHtml(p.id || "")}">${appliedOn ? "Applied" : "Mark applied"}</button>
            </div>
          </article>
        `;
      }).join("");

      container.querySelectorAll("button.pin").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const set = btn.getAttribute("data-act") === "short" ? shortlist : applied;
          if (set.has(id)) set.delete(id);
          else set.add(id);
          saveSets();
          render();
        });
      });

      container.querySelectorAll("button.tag[data-domain]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-domain");
          selectedDomains.add(id);
          const chip = document.querySelector(`#domain-chips .chip[data-domain="${CSS.escape(id)}"]`);
          if (chip) chip.classList.add("on");
          resetPageAndRender();
        });
      });
    }

    function dateFooter(p) {
      const kind = p.date_type || "";
      const when = p.close_date ? escapeHtml(p.close_date) : "";
      let text;
      if (kind === "review_start" && p.close_date) {
        text = `Review starts: ${when} (open until filled)`;
      } else if (kind === "open_until_filled") {
        text = "Open until filled";
      } else if (p.close_date) {
        text = `Close: ${when}`;
      } else {
        text = "Closing date not specified";
      }
      const stale = p.possibly_stale
        ? ` <span class="tag badge-stale">Possibly stale</span>`
        : "";
      const note = p.date_note
        ? `<span class="date-note">${escapeHtml(p.date_note)}</span>`
        : "";
      return `${text}${stale}${note}`;
    }

    function postPlace(p) {
      if (!p.source) return "unknown";
      return p.source === "HKUST-GZ" ? "Guangzhou" : "Hong Kong";
    }

    function contractSpan(p) {
      const low = Number.isFinite(p.contract_months) ? p.contract_months : null;
      const high = Number.isFinite(p.contract_months_max) ? p.contract_months_max : null;
      if (low == null && high == null) return null;
      const lo = low == null ? high : low;
      const hi = high == null ? low : high;
      return { lo, hi };
    }

    function contractMatches(p, bucket) {
      const span = contractSpan(p);
      if (!span) return bucket === "unknown";
      if (bucket === "unknown") return false;
      const { lo, hi } = span;
      if (bucket === "le6") return hi <= 6;
      if (bucket === "6-12") return lo <= 12 && hi > 6;
      if (bucket === "12-24") return lo <= 24 && hi > 12;
      if (bucket === "gt24") return hi > 24;
      return true;
    }

    function contractFooter(p) {
      const span = contractSpan(p);
      if (!span) return "";
      const { lo, hi } = span;
      const length = lo === hi ? `${lo} months` : `${lo}–${hi} months`;
      const renew = p.contract_renewable ? ", renewable" : "";
      return ` · Contract: ${length}${renew}`;
    }

    function deadlineMatches(p, mode) {
      const hard = (p.date_type || "") === "deadline" && !!p.close_date;
      if (mode === "has") return hard;
      if (mode === "none") return !hard;
      if (mode === "soon") {
        if (!hard) return false;
        const end = new Date(`${p.close_date}T00:00:00`);
        const days = (end - new Date()) / 86400000;
        return days >= 0 && days <= 30;
      }
      return true;
    }

    function degreeLabel(p) {
      const md = p.min_degree;
      if (md && md !== "unspecified") {
        const pretty = { bachelor: "Bachelor+", master: "Master+", doctor: "Doctor" };
        return pretty[md] || md;
      }
      return p.degree_level || "";
    }

    function summaryHtml(text) {
      const lines = String(text || "").split("\n").map((line) => line.trim()).filter(Boolean);
      const items = lines.filter((line) => line.startsWith("- "));
      if (items.length && items.length === lines.length) {
        return `<ul class="summary-list">${items.map((line) => `<li>${escapeHtml(line.slice(2))}</li>`).join("")}</ul>`;
      }
      return `<div class="summary">${escapeHtml(text || "")}</div>`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function resetPageAndRender() {
      currentPage = 1;
      render();
    }

    ["filter-source", "filter-work", "filter-held", "filter-requires", "filter-contract", "filter-place", "filter-deadline", "sort-by", "filter-shortlist", "filter-hide-applied"]
      .forEach((id) => {
        document.getElementById(id).addEventListener("change", resetPageAndRender);
      });

    document.getElementById("sort-by").addEventListener("change", () => {
      document.getElementById("sort-by").dataset.user = "1";
    });

    document.getElementById("search").addEventListener("input", () => {
      const sort = document.getElementById("sort-by");
      const q = document.getElementById("search").value.trim();
      if (!sort.dataset.user) {
        sort.value = q ? "relevance" : "close_date";
      }
      if (q) startSemantic();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        await updateQueryVector();
        resetPageAndRender();
      }, 280);
    });

    function showPage(page) {
      currentPage = page;
      render();
      document.getElementById("results").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.getElementById("prev-page").addEventListener("click", () => {
      if (currentPage > 1) showPage(currentPage - 1);
    });

    document.getElementById("next-page").addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil(getFiltered().length / PAGE_SIZE));
      if (currentPage < totalPages) showPage(currentPage + 1);
    });

    loadData();

    const UPDATE_ENDPOINT = "https://formsubmit.co/ajax/ac48761bb21d39f3bd60b0bd93065f06";

    document.getElementById("request-update").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      if (form._honey && form._honey.value) return;
      const button = form.querySelector("button");
      const status = document.getElementById("update-status");
      button.disabled = true;
      status.textContent = "Sending…";
      try {
        const res = await fetch(UPDATE_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            _subject: "HK research posts update request",
            _template: "table",
            message: "Please run a fresh scrape of the research posts."
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || "Request failed");
        status.textContent = data.message || "Request sent.";
      } catch (err) {
        status.textContent = "Could not send the request.";
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
